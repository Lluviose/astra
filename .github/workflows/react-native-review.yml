name: React Native review
on:
  push:
    branches: ['codex/astra-react-native-modern-*']
    paths: ['mobile/**', '.github/workflows/react-native-review.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/react-native-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rn-review-refs/heads/${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Format design iteration for review
        run: npm run format
      - name: Prepare verification output
        run: mkdir -p verification
      - name: TypeScript
        id: types
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee verification/typecheck.log
      - name: Domain tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee verification/tests.log
      - name: Expo dependency compatibility
        id: versions
        continue-on-error: true
        run: npx expo install --check 2>&1 | tee verification/versions.log
      - name: Export browser preview
        id: web
        continue-on-error: true
        env:
          EXPO_PUBLIC_DEMO_MODE: '1'
        run: npm run export:web 2>&1 | tee verification/web.log
      - name: Export iOS JavaScript bundle
        id: ios
        continue-on-error: true
        env:
          EXPO_PUBLIC_DEMO_MODE: '1'
        run: npm run export:ios -- --output-dir ios-export 2>&1 | tee verification/ios-export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-rn-web-and-checks
          path: |
            mobile/dist
            mobile/verification
            mobile/package.json
            mobile/package-lock.json
            mobile/src
            mobile/tests
            mobile/app.json
            mobile/tsconfig.json
            mobile/babel.config.js
            mobile/node_modules/prettier
      - name: Require all checks
        if: steps.types.outcome != 'success' || steps.tests.outcome != 'success' || steps.versions.outcome != 'success' || steps.web.outcome != 'success' || steps.ios.outcome != 'success'
        run: exit 1
  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      EXPO_PUBLIC_DEMO_MODE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate iOS project
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer; fi
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          ruby scripts/configure-ui-tests.rb
      - name: Review native navigation and persistence
        run: bash scripts/native-review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-rn-ios-review
          path: |
            mobile/verification
            mobile/build/Build/Products/Release-iphonesimulator/Astra.app
