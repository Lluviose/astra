name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed:
        description: "用仓库 Secrets 签名（需要 Apple 开发者账号），off 则只产出免签名 IPA"
        type: choice
        default: "off"
        options: ["off", "on"]
      publish_release:
        description: "把 IPA 挂到 GitHub Release"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: "1"
  EXPO_PUBLIC_DEMO_MODE: "0"
  SCHEME: Astra
  DERIVED_DATA: ${{ github.workspace }}/mobile/DerivedData
  ARCHIVE_PATH: ${{ github.workspace }}/mobile/build/Astra.xcarchive
  SIGNED_ARCHIVE_PATH: ${{ github.workspace }}/mobile/build/Astra-signed.xcarchive

jobs:
  build:
    name: 构建 + 测试 + 打包
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 26
        run: |
          set -euo pipefail
          # Prefer Xcode 26 when available on the runner.
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${XCODE:-}" ]; then
            sudo xcode-select -s "$XCODE"
            echo "使用 $XCODE"
          else
            echo "没有找到 Xcode 26，使用默认 $(xcode-select -p)"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 安装新版应用依赖
        run: npm ci

      - name: 类型与业务检查
        run: |
          npm run map:build
          git diff --exit-code -- assets/map/china-provinces.json
          npm run typecheck
          npm test

      - name: 生成 Expo iOS 工程
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          projects = list(Path("ios").glob("*.xcodeproj"))
          if len(projects) != 1:
              raise SystemExit("Expected exactly one generated application project")
          scheme = projects[0].stem
          workspace = projects[0].with_suffix(".xcworkspace")
          if not workspace.is_dir():
              raise SystemExit("CocoaPods workspace was not generated")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SCHEME={scheme}\nWORKSPACE={workspace.resolve()}\n")
          PYCODE

      - name: Archive（免签名）
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: 打包 IPA（免签名）
        run: |
          apps=("$ARCHIVE_PATH"/Products/Applications/*.app)
          test "${#apps[@]}" -eq 1
          APP="${apps[0]}"
          test -d "$APP" || { echo "找不到 Astra.app"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Astra.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Astra-unsigned.ipa
          mv Payload/Astra.app Astra-unsigned.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Astra-unsigned.app Astra-unsigned.app.zip
          ls -lh Astra-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Astra-ipa
          path: |
            mobile/build/Astra-unsigned.ipa
            mobile/build/Astra-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14

      # ---- 可选：仓库里有签名 Secrets 才做真机签名 ----
      - name: 检查签名 Secrets
        id: check-sign
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: 安装签名证书
        if: steps.check-sign.outputs.available == 'true' && github.event.inputs.signed == 'on'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -e
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci ci-build.keychain
          security set-keychain-settings -lut 21600 ci-build.keychain
          security unlock-keychain -p ci ci-build.keychain
          security import cert.p12 -k ci-build.keychain -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci-build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISION_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/astra.mobileprovision"
          rm -f cert.p12

      - name: Archive（签名）
        if: steps.check-sign.outputs.available == 'true' && github.event.inputs.signed == 'on'
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$SIGNED_ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_IDENTITY="${{ secrets.SIGNING_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISION_UUID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ secrets.BUNDLE_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ci-build.keychain"

      - name: 打包 IPA（签名）
        if: steps.check-sign.outputs.available == 'true' && github.event.inputs.signed == 'on'
        run: |
          apps=("$SIGNED_ARCHIVE_PATH"/Products/Applications/*.app)
          test "${#apps[@]}" -eq 1
          APP="${apps[0]}"
          test -d "$APP" || { echo "找不到已签名 Astra.app"; exit 1; }
          mkdir -p build/signed/Payload
          cp -R "$APP" build/signed/Payload/Astra.app
          cd build/signed
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../Astra-signed.ipa
          ls -lh ../Astra-signed.ipa

      - uses: actions/upload-artifact@v4
        if: steps.check-sign.outputs.available == 'true' && github.event.inputs.signed == 'on'
        with:
          name: Astra-signed-ipa
          path: mobile/build/Astra-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: 创建 Release 并挂 IPA
        if: github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="astra-$(date +%Y%m%d-%H%M%S)"
          FILE="build/Astra-unsigned.ipa"
          if [ -f "build/Astra-signed.ipa" ]; then FILE="build/Astra-signed.ipa"; fi
          gh release create "$TAG" "$FILE" --title "Astra $TAG" --notes "由 GitHub Actions 自动构建。"
          echo "Release: $TAG"

      - name: 构建结果摘要
        if: always()
        run: |
          printf '### Astra iOS IPA\n\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/Astra-unsigned.ipa ]; then
            printf '下载本次运行的 **Astra-ipa** artifact。默认产物为免签名 IPA，需要另行签名后安装。\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'IPA 尚未生成，请检查失败步骤。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
